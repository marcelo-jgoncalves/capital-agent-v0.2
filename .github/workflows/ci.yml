name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint/type-check tools
        # Pinned to the versions this config was actually validated
        # against locally. An unpinned `pip install ruff mypy` broke CI
        # the first time this workflow ran: a newer ruff's default rule
        # set differs from what pyproject.toml's `select` was written
        # against, and mypy's inference/strictness also drifts between
        # versions. Bump deliberately (and re-validate locally) rather
        # than floating.
        run: pip install ruff==0.15.11 mypy==1.20.2
      - name: Lint (ruff)
        run: ruff check src/ tests/
      - name: Type-check (mypy, src/ only -- see pyproject.toml note on adapters/)
        run: mypy src/
      - name: Run tests
        run: python -m unittest discover -s tests
